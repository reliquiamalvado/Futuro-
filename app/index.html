<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portão">
<link rel="manifest" href="/manifest.json">
<title>Portão</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
    --open: #16a34a; --close: #dc2626; --toggle: #2563eb; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px 24px;
  }
  header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 1.4rem; margin: 8px 0; }
  .icon-btn { background: none; border: 0; color: var(--muted); font-size: 1.4rem; cursor: pointer; padding: 8px; }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
  .status {
    background: var(--card); border-radius: 16px; padding: 20px; text-align: center;
  }
  .status .label { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
  .status .value { font-size: 1.8rem; font-weight: 700; margin-top: 6px; }
  .status .value.aberto { color: var(--open); }
  .status .value.fechado { color: var(--close); }
  .status .value.desconhecido { color: var(--muted); }
  .status .value.movendo { color: var(--warn); }
  .btn {
    border: 0; border-radius: 20px; color: #fff; font-size: 1.3rem; font-weight: 700;
    padding: 28px 16px; cursor: pointer; width: 100%;
    transition: transform .08s ease, opacity .2s ease;
    touch-action: manipulation; user-select: none;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.abrir { background: var(--open); }
  .btn.fechar { background: var(--close); }
  .btn.acionar { background: var(--toggle); padding: 40px 16px; font-size: 1.5rem; }
  .row { display: flex; gap: 16px; }
  .msg { min-height: 1.4em; text-align: center; color: var(--muted); }
  .msg.erro { color: #f87171; }
  dialog {
    background: var(--card); color: var(--text); border: 0; border-radius: 16px;
    width: min(92vw, 380px); padding: 20px;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: .9rem; }
  input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
    background: var(--bg); color: var(--text); font-size: 1rem;
  }
  .dlg-actions { display: flex; gap: 12px; margin-top: 20px; }
  .dlg-actions button { flex: 1; padding: 12px; border-radius: 10px; border: 0; font-size: 1rem; cursor: pointer; }
  .primary { background: var(--toggle); color: #fff; }
  .secondary { background: #334155; color: var(--text); }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <h1>🚪 Portão</h1>
    <button class="icon-btn" id="btnConfig" aria-label="Configurações">⚙️</button>
  </header>

  <main>
    <section class="status" aria-live="polite">
      <div class="label">Estado</div>
      <div class="value desconhecido" id="estado">—</div>
    </section>

    <button class="btn acionar" id="btnAcionar" data-acao="acionar">Acionar portão</button>

    <div class="row">
      <button class="btn abrir" id="btnAbrir" data-acao="abrir">Abrir</button>
      <button class="btn fechar" id="btnFechar" data-acao="fechar">Fechar</button>
    </div>

    <div class="msg" id="msg"></div>
  </main>

  <dialog id="dlgConfig">
    <form method="dialog" id="formConfig">
      <h2 style="margin-top:0">Configurações</h2>
      <label for="cfgToken">Senha de acesso</label>
      <input id="cfgToken" type="password" autocomplete="current-password" required>
      <label for="cfgUrl">Endereço do dispositivo (opcional)</label>
      <input id="cfgUrl" type="url" placeholder="http://portao.local">
      <p class="hint">Deixe o endereço vazio se o app foi aberto direto pelo ESP32.</p>
      <div class="dlg-actions">
        <button type="button" class="secondary" id="btnCancelar">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const NOMES = {
    aberto: "Aberto", fechado: "Fechado", movendo: "Em movimento", desconhecido: "Desconhecido",
  };

  const baseUrl = () => store.get("portao.url").replace(/\/+$/, "");
  const token = () => store.get("portao.token");

  function mensagem(texto, erro = false) {
    const el = $("msg");
    el.textContent = texto;
    el.classList.toggle("erro", erro);
  }

  function mostrarEstado(estado) {
    const el = $("estado");
    const chave = NOMES[estado] ? estado : "desconhecido";
    el.textContent = NOMES[chave];
    el.className = "value " + chave;
  }

  async function api(caminho, metodo = "GET") {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    try {
      const resp = await fetch(baseUrl() + caminho, {
        method: metodo,
        headers: { "X-Token": token() },
        signal: ctrl.signal,
      });
      const corpo = await resp.json().catch(() => ({}));
      if (resp.status === 401) throw new Error("Senha incorreta. Toque em ⚙️ para ajustar.");
      if (resp.status === 429) throw new Error("Aguarde um instante antes de acionar de novo.");
      if (!resp.ok) throw new Error(corpo.erro || `Erro ${resp.status}`);
      return corpo;
    } catch (e) {
      if (e.name === "AbortError") throw new Error("Dispositivo não respondeu. Está na mesma rede Wi-Fi?");
      if (e instanceof TypeError) throw new Error("Não foi possível conectar ao dispositivo.");
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function atualizarStatus() {
    if (!token()) return;
    try {
      const s = await api("/api/status");
      mostrarEstado(s.estado);
      // Esconde os botões separados quando a central só tem uma entrada (botoeira).
      const separado = !!s.abrirFecharSeparados;
      $("btnAbrir").parentElement.style.display = separado ? "flex" : "none";
      $("btnAcionar").style.display = separado ? "none" : "block";
    } catch (e) {
      mostrarEstado("desconhecido");
      mensagem(e.message, true);
    }
  }

  async function executar(acao, botao) {
    if (!token()) { abrirConfig(); return; }
    document.querySelectorAll(".btn").forEach((b) => (b.disabled = true));
    mensagem("Enviando comando…");
    try {
      await api("/api/" + acao, "POST");
      if (navigator.vibrate) navigator.vibrate(60);
      mensagem("Comando enviado ✔");
      setTimeout(cicloStatus, 800);
    } catch (e) {
      mensagem(e.message, true);
    } finally {
      setTimeout(() => document.querySelectorAll(".btn").forEach((b) => (b.disabled = false)), 1200);
    }
  }

  function abrirConfig() {
    $("cfgToken").value = token();
    $("cfgUrl").value = store.get("portao.url");
    $("dlgConfig").showModal();
  }

  document.querySelectorAll(".btn").forEach((b) =>
    b.addEventListener("click", () => executar(b.dataset.acao, b)));
  $("btnConfig").addEventListener("click", abrirConfig);
  $("btnCancelar").addEventListener("click", () => $("dlgConfig").close());
  $("formConfig").addEventListener("submit", () => {
    store.set("portao.token", $("cfgToken").value.trim());
    store.set("portao.url", $("cfgUrl").value.trim());
    mensagem("");
    cicloStatus();
  });

  // Consulta o estado a cada 5 s, ou a cada 1 s enquanto o portão se move.
  let timerStatus;
  async function cicloStatus() {
    clearTimeout(timerStatus);
    if (!document.hidden) await atualizarStatus();
    const movendo = $("estado").classList.contains("movendo");
    timerStatus = setTimeout(cicloStatus, movendo ? 1000 : 5000);
  }

  if (!token()) abrirConfig();
  cicloStatus();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cicloStatus(); });
})();
</script>
</body>
</html>
